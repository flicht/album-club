# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Fetch Album Data

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    environment: spotify-get-album-data

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install python-dotenv requests
        
    - name: get_data script
      env:
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      run: |
        python scripts/get_album_data.py
    # Only main gets the regenerated data committed back. On a pull request
    # the checkout is a detached HEAD of the merge ref, so there is no branch
    # to push to — the step above still runs, which is what checks that the
    # album ids in albumData.json are ones spotify knows about.
    - name: commit & push files
      if: github.event_name == 'push'
      run: |
        git config --local user.email fred@fredlich.com
        git config --local user.name flicht
        git add -A
        if git diff --staged --quiet; then
          echo "No album data changes to commit"
        else
          git commit -m "update album data"
          git push
        fi
        
